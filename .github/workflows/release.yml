name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
