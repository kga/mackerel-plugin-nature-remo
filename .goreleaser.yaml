version: 2

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm, "386", mipsle]
    goarm: ["6"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: darwin, goarch: "386" }
      - { goos: darwin, goarch: mipsle }
      - { goos: windows, goarch: arm64 }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: mipsle }

# mkr plugin install looks for <name>_<os>_<arch>.zip.
archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
